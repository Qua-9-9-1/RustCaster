name: Release

# Pushing a tag like v0.1.0 builds the binaries and publishes a GitHub release.
# "Run workflow" (manual) only builds and keeps the binaries as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rustcaster-build .

      - name: Build and package
        run: docker run --rm -v "$PWD:/repo" -w /repo/rustcaster rustcaster-build sh ../scripts/package-windows.sh

      - name: Zip
        run: cd rustcaster/dist && zip -qr "$GITHUB_WORKSPACE/rustcaster-windows-x64.zip" rustcaster-windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: rustcaster-windows-x64
          path: rustcaster-windows-x64.zip

  linux:
    name: Linux x64
    # oldest available runner = oldest glibc required by the binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 and GTK (file dialog)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: rustcaster
        run: cargo build --release

      - name: Package
        run: |
          out=rustcaster-linux-x64
          mkdir -p "$out"
          cp rustcaster/target/release/rustcaster "$out/"
          cp -r rustcaster/assets rustcaster/maps "$out/"
          tar czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: rustcaster-linux-x64
          path: rustcaster-linux-x64.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rustcaster-windows-x64.zip
            rustcaster-linux-x64.tar.gz
          generate_release_notes: true
