[package]
name = "rustcaster"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sdl2 = "0.34.3"
image = "0.24.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native file-open dialog of the preset editor (+ the window handle type it takes as parent)
rfd = "0.15"
raw-window-handle = "0.6"

# Optimise even the default (debug) build: an unoptimised game loop is far too slow
[profile.dev]
opt-level = 2
